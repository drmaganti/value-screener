name: Weekly Value Screen

on:
  schedule:
    # 04:00 UTC Monday = ~Sunday midnight ET while daylight time is in effect.
    # Email lands before Monday's market open.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-screener-state
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh index constituents
        run: python refresh_universe.py
        continue-on-error: true

      - name: Run weekly screen (V2)
        env:
          PROVIDER: yfinance
          CLASSIFIER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OFFICIAL_RUN: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # Only the scheduled Monday run receives email credentials. Manual
          # runs produce a local preview and cannot send the production digest.
          EMAIL_FROM: ${{ github.event_name == 'schedule' && secrets.EMAIL_FROM || '' }}
          EMAIL_APP_PASSWORD: ${{ github.event_name == 'schedule' && secrets.EMAIL_APP_PASSWORD || '' }}
          EMAIL_TO: ${{ github.event_name == 'schedule' && secrets.EMAIL_TO || '' }}
        run: python value_screener_v2_runner.py

      - name: Persist official V2 learning data and universe
        if: github.event_name == 'schedule'
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add picks_log.json candidate_log.json universe.json fundamentals_cache.json 2>/dev/null || git add picks_log.json
          git diff --staged --quiet || git commit -m "Weekly V2 run: update official logs + universe + cache [skip ci]"
          git pull --rebase origin main
          git push
