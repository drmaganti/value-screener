name: Historical Outcome Backfill

on:
  # Adding/updating this workflow on main triggers the idempotent migration.
  # workflow_dispatch remains available for an explicit maintenance rerun.
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-backfill.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-screener-state
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recompute legacy exact-horizon outcomes
        env:
          PROVIDER: yfinance
        run: python backfill_history.py

      - name: Persist corrected historical fields
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add picks_log.json
          git diff --staged --quiet || git commit -m "Backfill corrected exact-horizon outcomes [skip ci]"
          git pull --rebase origin main
          git push
