name: Daily Value Screen

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (data only; no email)
        env:
          PROVIDER: yfinance
          CLASSIFIER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Deliberately do not expose EMAIL_* credentials here. The legacy V1
          # daily run is retained for tracking/learning, but only the Monday V2
          # workflow is allowed to send the production digest.
        run: python value_screener.py

      - name: Persist cooldown state
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update cooldown state [skip ci]"
          git push
